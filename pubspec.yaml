name: mundial2026
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/estadios/
    - assets/alineaciones/
    - assets/banderas_historicas/
    - assets/icono_app.png
    - assets/icono_splash.png
    - assets/icono_circular.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icono_app.png"
  adaptive_icon_background: "#00205B"
  adaptive_icon_foreground: "assets/icono_app.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#00205B"
  image: assets/icono_splash.png
  color_dark: "#00205B"
  image_dark: assets/icono_splash.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#00205B"
    icon_background_color: "#00205B"
    image: assets/icono_splash.png
  fullscreen: true
